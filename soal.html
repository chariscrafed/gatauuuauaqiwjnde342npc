<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCA HOTS — 340 Soal 17 Kitab Nabi</title>

    <style>
         :root {
            --bg: #08111f;
            --panel: #0e1b2e;
            --panel2: #12243b;
            --line: #243b5a;
            --text: #edf4ff;
            --muted: #9fb2ca;
            --gold: #e7b95e;
            --green: #48d597;
            --red: #ff6b6b;
            --blue: #65a9ff;
            --purple: #a98bff;
        }
        
        * {
            box-sizing: border-box;
        }
        
        body {
            margin: 0;
            font-family: Inter, Segoe UI, Arial, sans-serif;
            background: radial-gradient(circle at top right, #132a4b 0, transparent 35%), radial-gradient(circle at bottom left, #101f36 0, transparent 35%), var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        
        header {
            position: sticky;
            top: 0;
            z-index: 20;
            background: rgba(8, 17, 31, .94);
            backdrop-filter: blur(14px);
            border-bottom: 1px solid var(--line);
            padding: 18px 25px;
        }
        
        .header-inner {
            max-width: 1400px;
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }
        
        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }
        
        .logo-icon {
            width: 45px;
            height: 45px;
            border-radius: 13px;
            background: linear-gradient(135deg, #e7b95e, #b67d28);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #15100a;
            font-size: 22px;
            font-weight: 900;
        }
        
        .logo h1 {
            margin: 0;
            font-size: 20px;
        }
        
        .logo p {
            margin: 3px 0 0;
            color: var(--muted);
            font-size: 12px;
        }
        
        .stats {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }
        
        .stat {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 10px;
            padding: 8px 13px;
            font-size: 12px;
        }
        
        .stat strong {
            color: var(--gold);
        }
        
        .layout {
            max-width: 1400px;
            margin: auto;
            display: grid;
            grid-template-columns: 270px 1fr;
            min-height: calc(100vh - 82px);
        }
        
        .sidebar {
            border-right: 1px solid var(--line);
            padding: 20px 14px;
            position: sticky;
            top: 82px;
            height: calc(100vh - 82px);
            overflow-y: auto;
        }
        
        .sidebar-title {
            color: var(--muted);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin: 4px 10px 12px;
        }
        
        .book-btn {
            width: 100%;
            text-align: left;
            border: 1px solid transparent;
            background: transparent;
            color: var(--muted);
            padding: 10px 11px;
            border-radius: 9px;
            cursor: pointer;
            margin-bottom: 3px;
            transition: .2s;
        }
        
        .book-btn:hover {
            background: var(--panel);
            color: white;
        }
        
        .book-btn.active {
            background: linear-gradient(90deg, #1a304d, #122238);
            border-color: #315273;
            color: white;
        }
        
        .book-number {
            display: inline-flex;
            width: 27px;
            height: 27px;
            align-items: center;
            justify-content: center;
            border-radius: 7px;
            background: #15283f;
            margin-right: 7px;
            font-size: 11px;
            color: var(--gold);
        }
        
        .main {
            padding: 30px;
            min-width: 0;
        }
        
        .hero {
            background: linear-gradient(135deg, rgba(40, 76, 115, .35), rgba(14, 27, 46, .8)), var(--panel);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 27px;
            margin-bottom: 22px;
        }
        
        .hero-top {
            display: flex;
            justify-content: space-between;
            gap: 20px;
            align-items: flex-start;
        }
        
        .badge {
            display: inline-block;
            padding: 6px 10px;
            border-radius: 20px;
            background: #1d3048;
            color: var(--gold);
            font-size: 11px;
            font-weight: 800;
            letter-spacing: .5px;
        }
        
        .hero h2 {
            font-size: 32px;
            margin: 10px 0 5px;
        }
        
        .hero p {
            color: var(--muted);
            line-height: 1.65;
            margin: 0;
        }
        
        .progress-wrap {
            min-width: 210px;
        }
        
        .progress-label {
            display: flex;
            justify-content: space-between;
            color: var(--muted);
            font-size: 11px;
            margin-bottom: 7px;
        }
        
        .progress {
            height: 8px;
            background: #18283d;
            border-radius: 10px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--gold), #f3d58b);
            transition: .3s;
        }
        
        .toolbar {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        
        .search {
            flex: 1;
            min-width: 220px;
            background: var(--panel);
            border: 1px solid var(--line);
            color: white;
            padding: 12px 15px;
            border-radius: 10px;
            outline: none;
        }
        
        .search:focus {
            border-color: #547ba5;
        }
        
        .tool-btn {
            border: 1px solid var(--line);
            background: var(--panel);
            color: var(--text);
            padding: 11px 15px;
            border-radius: 10px;
            cursor: pointer;
        }
        
        .tool-btn:hover {
            background: var(--panel2);
        }
        
        .question-card {
            background: var(--panel);
            border: 1px solid var(--line);
            border-radius: 17px;
            padding: 25px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, .12);
        }
        
        .question-head {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .question-number {
            color: var(--gold);
            font-weight: 900;
            font-size: 13px;
        }
        
        .level {
            padding: 5px 9px;
            border-radius: 15px;
            font-size: 10px;
            font-weight: 800;
            background: #241e36;
            color: #c5b4ff;
        }
        
        .question {
            font-size: 18px;
            line-height: 1.65;
            font-weight: 650;
            margin-bottom: 18px;
        }
        
        .options {
            display: grid;
            gap: 10px;
        }
        
        .option {
            border: 1px solid #29415f;
            background: #0b1728;
            color: #dce8f7;
            padding: 14px 16px;
            border-radius: 11px;
            text-align: left;
            cursor: pointer;
            transition: .2s;
            font-size: 14px;
            line-height: 1.5;
        }
        
        .option:hover:not(:disabled) {
            border-color: #547ba5;
            background: #11233a;
            transform: translateX(2px);
        }
        
        .option:disabled {
            cursor: default;
        }
        
        .option.correct {
            border-color: var(--green);
            background: rgba(72, 213, 151, .12);
            color: #9ff1cd;
        }
        
        .option.wrong {
            border-color: var(--red);
            background: rgba(255, 107, 107, .10);
            color: #ffb0b0;
        }
        
        .result {
            margin-top: 18px;
            padding: 17px;
            border-radius: 12px;
            display: none;
            line-height: 1.65;
        }
        
        .result.show {
            display: block;
        }
        
        .result.correct-box {
            border: 1px solid rgba(72, 213, 151, .35);
            background: rgba(72, 213, 151, .08);
        }
        
        .result.wrong-box {
            border: 1px solid rgba(255, 107, 107, .35);
            background: rgba(255, 107, 107, .07);
        }
        
        .result-title {
            font-weight: 900;
            margin-bottom: 7px;
        }
        
        .explanation {
            color: #c5d3e4;
            font-size: 13px;
        }
        
        .answer {
            color: var(--gold);
            font-weight: 800;
        }
        
        .why {
            margin-top: 8px;
        }
        
        .book-section {
            display: none;
        }
        
        .book-section.active {
            display: block;
        }
        
        .empty {
            text-align: center;
            padding: 60px;
            color: var(--muted);
        }
        
        @media(max-width:900px) {
            .layout {
                grid-template-columns: 1fr;
            }
            .sidebar {
                position: relative;
                top: 0;
                height: auto;
                border-right: 0;
                border-bottom: 1px solid var(--line);
                max-height: 300px;
            }
            .main {
                padding: 17px;
            }
            .hero-top {
                flex-direction: column;
            }
            .progress-wrap {
                width: 100%;
            }
        }
        
        @media(max-width:600px) {
            header {
                padding: 14px;
            }
            .header-inner {
                align-items: flex-start;
                flex-direction: column;
            }
            .hero h2 {
                font-size: 25px;
            }
            .question {
                font-size: 16px;
            }
            .question-card {
                padding: 18px;
            }
        }
    </style>
</head>

<body>

    <header>
        <div class="header-inner">

            <div class="logo">
                <div class="logo-icon">✝</div>
                <div>
                    <h1>CCA HOTS — 17 Kitab Nabi</h1>
                    <p>340 Soal Analisis • 20 Soal per Kitab</p>

            <div class="stats">

            <div id="content"></div>

        </main>
    </div>

    <script>
        /* ============================================================
           DATABASE 17 KITAB
           20 SOAL HOTS PER KITAB = 340 SOAL
        ============================================================ */

        const BOOKS = [

            {
                name: "Yesaya",
                theme: "Kekudusan Allah, penghakiman, pengharapan dan keselamatan",
                questions: [
                    [
                        "Yesaya 6 menggambarkan Yesaya melihat TUHAN dalam kekudusan-Nya. Mengapa pengalaman tersebut justru membuat Yesaya menyadari kenajisannya sebelum menerima panggilan?", ["Karena kekudusan Allah memperlihatkan kontras dengan kondisi manusia", "Karena Yesaya tidak mengenal Israel", "Karena Yesaya ingin menjadi imam", "Karena Yesaya sedang mencari kedudukan"],
                        0,
                        "Kekudusan Allah menjadi cermin yang membuat manusia menyadari keberdosaannya. Setelah mengakui keadaan dirinya, Yesaya mengalami penyucian dan kemudian siap diutus."
                    ],
                    [
                        "Jika Yesaya 1 menegur ibadah yang penuh ritual tetapi tidak disertai keadilan, kesimpulan paling tepat adalah...", ["Ritual ibadah tidak diperlukan sama sekali", "Allah menolak semua bentuk ibadah", "Ibadah sejati harus berjalan bersama pertobatan dan kehidupan yang benar", "Keadilan sosial lebih penting daripada Allah"],

                        "Tradisi Kristen memahami Hamba yang menderita sebagai teks penting untuk memahami karya penebusan Kristus."

                    [

                        1,
                        "Kesadaran akan kekudusan Allah tidak membuat Yesaya menjauh setelah disucikan; ia justru menjawab panggilan."

                        1,
                        "Terang menjadi simbol pengharapan Allah di tengah kondisi gelap akibat dosa dan krisis."
                    ],
                    [
                        "Seruan 'Sebab seorang anak telah lahir untuk kita' dalam Yesaya 9 menjadi penting bagi pembacaan Kristen karena...", ["Kerajaan manusia dianggap tidak penting", "Harapan pemerintahan ilahi kemudian dibaca dalam terang Kristus", "Yesaya sedang menceritakan masa kecil Paulus", "Nabi sedang menulis kitab sejarah Romawi"],
                        1,
                        "Teks ini memiliki konteks kerajaan dan harapan bagi umat, kemudian dibaca dalam tradisi Kristen dalam hubungan dengan pemerintahan Kristus."

                    [
                        "Jika Yehuda ingin meminta pertolongan bangsa asing daripada percaya kepada TUHAN, kritik Yesaya terutama menyangkut...", ["Strategi ekonomi", "Kegagalan mempercayakan keamanan kepada Allah", "Kurangnya tentara", "Masalah bahasa"],

        const TOTAL_EXPECTED = 340;

        let allQuestions = [];
        let currentBook = 0;
        let answered = 0;
        let correct = 0;
        let selectedQuestions = [];

        function buildDatabase() {

            allQuestions = [];

            BOOKS.forEach((book, bookIndex) => {

                book.questions.forEach((item, qIndex) => {

                    allQuestions.push({
                        id: bookIndex * 20 + qIndex + 1,
                        bookIndex,
                        book: book.name,
                        question: item[0],
                        options: item[1],
                        answer: item[2],
                        explanation: item[3]
                    });

                });

            });

            if (allQuestions.length !== TOTAL_EXPECTED) {
                console.warn(
                    "Jumlah soal saat ini:",
                    allQuestions.length,
                    "Target:",
                    TOTAL_EXPECTED
                );
            }

            selectedQuestions = allQuestions.slice();
        }

/* ============================================================
   JAWAB SOAL
============================================================ */

const answeredQuestions = new Set();
const correctQuestions = new Set();

function answerQuestion(questionId, selected, button){

    if(answeredQuestions.has(questionId)){
        return;
    }

    const q = allQuestions.find(
        item => item.id === questionId
    );

    if(!q) return;

    answeredQuestions.add(questionId);

    answered++;

    const card =
        button.closest(".question-card");

    const buttons =
        card.querySelectorAll(".option");

    buttons.forEach(btn=>{
        btn.disabled = true;
    });

    const isCorrect =
        selected === q.answer;

    if(isCorrect){

        correct++;

        correctQuestions.add(questionId);

        button.classList.add("correct");

    }else{

        button.classList.add("wrong");

        buttons[q.answer].classList.add("correct");

    }

    const result =
        document.getElementById(`result-${questionId}`);

    result.classList.add(
        "show",
        isCorrect
            ? "correct-box"
            : "wrong-box"
    );

    const correctLetter =
        String.fromCharCode(65 + q.answer);

    result.innerHTML = `

        <div class="result-title">
            ${isCorrect
                ? "✅ BENAR! Analisis kamu tepat."
                : "❌ BELUM TEPAT. Yuk bedah logikanya."
            }
        </div>

        <div>
            Jawaban yang benar:
            <span class="answer">
                ${correctLetter}. ${q.options[q.answer]}
            </span>
        </div>

        <div class="why">
            <strong>📖 Pembahasan:</strong>
            <div class="explanation">
                ${q.explanation}
            </div>
        </div>

    `;

    updateStats();
    updateBookProgress();
}

/* ============================================================
   PROGRESS
============================================================ */

function updateStats(){

    document.getElementById("answeredStat").textContent =
        answered;

    document.getElementById("correctStat").textContent =
        correct;

    const score =
        answered === 0
            ? 0
            : Math.round((correct / answered) * 100);

    document.getElementById("scoreStat").textContent =
        score + "%";
}

function updateBookProgress(){

    const questions =
        allQuestions.filter(
            q => q.bookIndex === currentBook
        );

    const done =
        questions.filter(
            q => answeredQuestions.has(q.id)
        ).length;

    const percent =
        (done / questions.length) * 100;

    const bar =
        document.getElementById("bookProgress");

    const text =
        document.getElementById("bookProgressText");

    if(bar){
        bar.style.width = percent + "%";
    }

    if(text){
        text.textContent =
            `${done} / ${questions.length}`;
    }
}

/* ============================================================
   RESET
============================================================ */

function resetAll(){

    if(!confirm(
        "Reset seluruh progress 340 soal?"
    )){
        return;
    }

    answeredQuestions.clear();
    correctQuestions.clear();

    answered = 0;
    correct = 0;

    updateStats();

    renderSidebar();
    renderBook(currentBook);

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}

/* ============================================================
   SEARCH
============================================================ */

document
.getElementById("searchInput")
.addEventListener("input",function(){

    const keyword =
        this.value
        .toLowerCase()
        .trim();

    if(!keyword){

        renderBook(currentBook);

        return;
    }

    const results =
        allQuestions.filter(q=>
            q.question
            .toLowerCase()
            .includes(keyword)
            ||
            q.book
            .toLowerCase()
            .includes(keyword)
            ||
            q.explanation
            .toLowerCase()
            .includes(keyword)
        );

    const content =
        document.getElementById("content");

    content.innerHTML = `

        <div class="hero">

            <span class="badge">
                HASIL PENCARIAN
            </span>

            <h2>${results.length} soal ditemukan</h2>

            <p>
                Kata kunci:
                <strong>${keyword}</strong>
            </p>

        </div>

        <div id="searchResults"></div>
    `;

    const container =
        document.getElementById("searchResults");

    if(results.length === 0){

        container.innerHTML = `
            <div class="empty">
                Tidak ada soal yang cocok.
            </div>
        `;

        return;
    }

    results.forEach(q=>{

        const card =
            document.createElement("div");

        card.className =
            "question-card";

        card.innerHTML = `

            <div class="question-head">

                <div class="question-number">
                    SOAL ${q.id} • ${q.book.toUpperCase()}
                </div>

                <div class="level">
                    HOTS
                </div>

            </div>

            <div class="question">
                ${q.question}
            </div>

            <div class="options">

                ${q.options.map((option,optIndex)=>`

                    <button
                        class="option"
                        onclick="
                            answerQuestion(
                                ${q.id},
                                ${optIndex},
                                this
                            )
                        "
                    >
                        <strong>
                            ${String.fromCharCode(65+optIndex)}.
                        </strong>
                        ${option}
                    </button>

                `).join("")}

            </div>

            <div
                class="result"
                id="result-${q.id}"
            ></div>

        `;

        container.appendChild(card);

    });

});
