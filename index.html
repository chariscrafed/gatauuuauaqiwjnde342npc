<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>THE GREAT JOURNEY — 17 Kitab</title>

    <style>
         :root {
            --bg: #08111f;
            --panel: #0d192b;
            --panel2: #111f34;
            --line: #20324c;
            --text: #e8eef7;
            --muted: #91a1b8;
            --accent: #6fa8dc;
            --accent2: #9ec5ee;
            --gold: #d9b56d;
            --danger: #d97979;
            --shadow: 0 15px 40px rgba(0, 0, 0, .25);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        html {
            scroll-behavior: smooth;
        }
        
        body {
            font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at 15% 10%, rgba(111, 168, 220, .08), transparent 30%), radial-gradient(circle at 90% 80%, rgba(217, 181, 109, .05), transparent 30%), var(--bg);
            color: var(--text);
            min-height: 100vh;
        }
        /* ================= SIDEBAR ================= */
        
        .sidebar {
            position: fixed;
            left: 0;
            top: 0;
            bottom: 0;
            width: 305px;
            background: rgba(8, 17, 31, .97);
            border-right: 1px solid var(--line);
            overflow-y: auto;
            z-index: 100;
            padding: 25px 18px;
        }
        
        .logo {
            padding: 5px 8px 22px;
        }
        
        .logo h1 {
            font-size: 22px;
            letter-spacing: 2px;
            color: white;
        }
        
        .logo p {
            color: var(--gold);
            font-size: 12px;
            margin-top: 7px;
            letter-spacing: 1.5px;
        }
        
        .search {
            width: 100%;
            background: #0b1627;
            border: 1px solid var(--line);
            color: white;
            padding: 12px 14px;
            border-radius: 10px;
            outline: none;
            margin-bottom: 15px;
        }
        
        .search:focus {
            border-color: var(--accent);
        }
        
        .book-list {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        
        .book-btn {
            border: 0;
            background: transparent;
            color: var(--muted);
            text-align: left;
            padding: 10px 12px;
            border-radius: 9px;
            cursor: pointer;
            transition: .2s;
            font-size: 14px;
        }
        
        .book-btn:hover {
            background: var(--panel);
            color: white;
        }
        
        .book-btn.active {
            background: linear-gradient(90deg, rgba(111, 168, 220, .18), rgba(111, 168, 220, .05));
            color: white;
            border-left: 3px solid var(--accent);
        }
        
        .book-number {
            display: inline-block;
            width: 27px;
            color: var(--gold);
            font-size: 12px;
        }
        /* ================= MAIN ================= */
        
        .main {
            margin-left: 305px;
            padding: 40px;
            max-width: 1500px;
        }
        
        .hero {
            min-height: 300px;
            display: flex;
            align-items: center;
            padding: 45px;
            border: 1px solid var(--line);
            border-radius: 24px;
            background: linear-gradient(135deg, rgba(111, 168, 220, .12), transparent 45%), linear-gradient(315deg, rgba(217, 181, 109, .07), transparent 45%), var(--panel);
            box-shadow: var(--shadow);
            margin-bottom: 25px;
        }
        
        .hero-content {
            max-width: 900px;
        }
        
        .badge {
            display: inline-block;
            color: var(--gold);
            font-size: 12px;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 12px;
        }
        
        .hero h2 {
            font-size: clamp(32px, 5vw, 60px);
            line-height: 1;
            margin-bottom: 15px;
        }
        
        .hero p {
            color: var(--muted);
            font-size: 16px;
            line-height: 1.8;
            max-width: 760px;
        }
        
        .meta {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 22px;
        }
        
        .meta span {
            padding: 7px 11px;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: #0a1525;
            color: #b9c7d9;
            font-size: 12px;
        }
        /* ================= GRID ================= */
        
        .grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 20px;
        }
        
        .card {
            background: rgba(13, 25, 43, .88);
            border: 1px solid var(--line);
            border-radius: 18px;
            padding: 25px;
            box-shadow: var(--shadow);
        }
        
        .card.full {
            grid-column: 1/-1;
        }
        
        .card h3 {
            font-size: 19px;
            margin-bottom: 15px;
        }
        
        .card h3 .icon {
            margin-right: 8px;
        }
        
        .card p {
            color: #c2ccda;
            line-height: 1.85;
            margin-bottom: 14px;
        }
        
        .story p {
            font-size: 15px;
        }
        
        .quote {
            border-left: 3px solid var(--gold);
            padding: 14px 18px;
            margin: 18px 0;
            background: rgba(217, 181, 109, .05);
            color: #e9d6a9;
            line-height: 1.7;
            border-radius: 0 10px 10px 0;
        }
        
        .quote small {
            display: block;
            margin-top: 7px;
            color: var(--muted);
        }
        /* ================= CHARACTER ================= */
        
        .character-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }
        
        .character {
            padding: 16px;
            border: 1px solid var(--line);
            background: #0b1728;
            border-radius: 13px;
        }
        
        .character strong {
            display: block;
            color: white;
            margin-bottom: 6px;
        }
        
        .character .role {
            color: var(--gold);
            font-size: 12px;
            margin-bottom: 8px;
        }
        
        .character p {
            font-size: 13px;
            margin-bottom: 8px;
            line-height: 1.7;
        }
        
        .ref {
            color: #83b6e7;
            font-size: 11px;
        }
        /* ================= PROPHECY ================= */
        
        .prophecy {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 12px;
        }
        
        .prophecy-item {
            border: 1px solid var(--line);
            padding: 16px;
            border-radius: 13px;
            background: #0a1626;
        }
        
        .prophecy-item strong {
            color: #e8d09a;
            display: block;
            margin-bottom: 8px;
        }
        
        .prophecy-item p {
            font-size: 13px;
        }
        /* ================= BUTTONS ================= */
        
        .links {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 15px;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 7px;
            text-decoration: none;
            padding: 11px 15px;
            border-radius: 10px;
            border: 1px solid var(--line);
            color: #dce8f5;
            background: #0b1728;
            font-size: 13px;
            transition: .2s;
        }
        
        .btn:hover {
            transform: translateY(-1px);
            border-color: var(--accent);
            background: #102139;
        }
        
        .btn.primary {
            background: rgba(111, 168, 220, .14);
            border-color: rgba(111, 168, 220, .4);
        }
        
        .btn.gold {
            background: rgba(217, 181, 109, .1);
            border-color: rgba(217, 181, 109, .3);
        }
        
        .btn.quiz {
            background: rgba(123, 91, 173, .12);
            border-color: rgba(150, 120, 205, .35);
        }
        /* ================= VERSES ================= */
        
        .verse-list {
            display: grid;
            gap: 10px;
        }
        
        .verse {
            padding: 15px;
            background: #0a1626;
            border: 1px solid var(--line);
            border-radius: 12px;
        }
        
        .verse strong {
            color: var(--gold);
            display: block;
            margin-bottom: 6px;
        }
        
        .verse p {
            margin: 0;
            font-size: 14px;
        }
        /* ================= TERMS ================= */
        
        .term-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .term {
            padding: 7px 10px;
            border: 1px solid var(--line);
            border-radius: 8px;
            font-size: 12px;
            color: #b7c6d9;
            background: #0a1626;
        }
        /* ================= FOOTER ================= */
        
        .footer {
            text-align: center;
            color: #697b94;
            font-size: 12px;
            padding: 35px 10px 20px;
            line-height: 1.8;
        }
        
        .next {
            margin-top: 20px;
            display: flex;
            justify-content: space-between;
            gap: 10px;
        }
        
        .next button {
            flex: 1;
            background: #0b1728;
            color: #dce8f5;
            border: 1px solid var(--line);
            border-radius: 12px;
            padding: 13px;
            cursor: pointer;
        }
        
        .next button:hover {
            border-color: var(--accent);
        }
        
        .progress {
            position: fixed;
            top: 0;
            left: 305px;
            height: 3px;
            width: 0%;
            background: var(--accent);
            z-index: 200;
        }
        /* ================= MOBILE ================= */
        
        .mobile-header {
            display: none;
        }
        
        @media(max-width:900px) {
            .sidebar {
                width: 260px;
                transform: translateX(-100%);
                transition: .3s;
            }
            .sidebar.open {
                transform: translateX(0);
            }
            .main {
                margin-left: 0;
                padding: 20px;
                padding-top: 75px;
            }
            .progress {
                left: 0;
            }
            .mobile-header {
                display: flex;
                position: fixed;
                top: 0;
                left: 0;
                right: 0;
                height: 60px;
                background: rgba(8, 17, 31, .95);
                border-bottom: 1px solid var(--line);
                z-index: 150;
                align-items: center;
                padding: 0 15px;
                gap: 12px;
            }
            .menu {
                border: 1px solid var(--line);
                background: #0b1728;
                color: white;
                width: 38px;
                height: 38px;
                border-radius: 9px;
                cursor: pointer;
            }
            .mobile-header strong {
                font-size: 14px;
                letter-spacing: 1px;
            }
            .grid {
                grid-template-columns: 1fr;
            }
            .card.full {
                grid-column: auto;
            }
            .character-grid,
            .prophecy {
                grid-template-columns: 1fr;
            }
            .hero {
                padding: 30px 23px;
                min-height: auto;
            }
        }
        /* ================= LOADING ================= */
        
        .fade {
            animation: fade .35s ease;
        }
        
        @keyframes fade {
            from {
                opacity: 0;
                transform: translateY(7px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <div class="progress" id="progress"></div>

    <header class="mobile-header">
        <button class="menu" onclick="toggleSidebar()">☰</button>
        <strong>THE GREAT JOURNEY</strong>
    </header>

    <aside class="sidebar" id="sidebar">

        <div class="logo">
            <h1>THE GREAT JOURNEY</h1>
            <p>17 KITAB NABI • ALKITAB</p>
        </div>

        <input type="text" id="search" class="search" placeholder="Cari kitab..." oninput="filterBooks()">

        <div class="book-list" id="bookList"></div>

    </aside>

    <main class="main">

        <section class="hero fade" id="hero"></section>

        <section class="grid fade" id="content"></section>

        <div class="next">
            <button onclick="previousBook()">← Kitab Sebelumnya</button>
            <button onclick="nextBook()">Kitab Berikutnya →</button>
        </div>

        <footer class="footer">
            <strong>THE GREAT JOURNEY — 17 KITAB</strong><br> Menelusuri suara para nabi dari Yesaya sampai Maleakhi.<br>
            <br> “Sebab segala sesuatu yang ditulis dahulu, telah ditulis untuk menjadi pelajaran bagi kita.”
            <br> Roma 15:4
        </footer>

    </main>

    <script>
        /* =========================================================
           DATABASE 17 KITAB
        ========================================================= */

        const BOOKS = [

            /* ================= YESAYA ================= */

            {
                id: "yesaya",
                no: 23,
                name: "Yesaya",
                period: "± 740–680 SM",
                setting: "Yehuda dan Yerusalem",
                theme: "Kekudusan Allah, penghakiman, pertobatan, pengharapan dan keselamatan",

                story: `

<p>
Kitab Yesaya dibuka pada masa ketika Yehuda masih memiliki kerajaan,
tetapi kehidupan rohani dan sosial bangsa itu sedang mengalami kerusakan.
Yesaya hidup pada zaman raja Uzia, Yotam, Ahas dan Hizkia. Ia dipanggil
Allah bukan sekadar untuk mengatakan bahwa hukuman akan datang, tetapi
untuk membuka mata bangsa itu terhadap keadaan hati mereka.
</p>

<p>
Panggilan Yesaya terjadi dalam sebuah penglihatan yang sangat kuat.
Ia melihat Tuhan duduk di atas takhta yang tinggi dan menjulang.
Para serafim berseru bahwa Tuhan itu kudus. Ketika menyadari kekudusan
Allah, Yesaya justru melihat dirinya sebagai manusia yang najis bibir.
Namun Allah menyediakan jalan pemulihan. Setelah Yesaya disucikan,
ia mendengar pertanyaan: siapa yang akan diutus? Yesaya menjawab,
“Ini aku, utuslah aku!” (Yesaya 6:8).
</p>

<p>
Pelayanan Yesaya berlangsung ketika ancaman politik sangat besar.
Kerajaan Asyur berkembang menjadi kekuatan yang menakutkan.
Raja Ahas memilih mengandalkan kekuatan politik daripada mempercayai
Tuhan. Dalam keadaan tersebut Yesaya menyampaikan tanda Imanuel:
Allah tidak meninggalkan umat-Nya. Kepada Hizkia, Yesaya juga menyampaikan
pesan ketika Sanherib, raja Asyur, mengepung Yerusalem. Yerusalem berada
dalam keadaan genting, tetapi Tuhan menunjukkan bahwa keselamatan tidak
bergantung pada kekuatan manusia.
</p>

<p>
Setelah berbicara tentang dosa dan penghakiman, Yesaya membawa umat
kepada pengharapan. Ia berbicara mengenai tunas yang akan muncul dari
keturunan Daud, seorang Raja yang pemerintahannya membawa damai.
Ia juga berbicara tentang Hamba Tuhan yang menderita, menanggung
kesalahan banyak orang, dan melalui penderitaan-Nya membawa keselamatan.
Karena itu, kitab Yesaya tidak berhenti pada kehancuran. Setelah malam
penghakiman, ada janji pemulihan.
</p>

<p>
Pada bagian akhir, perhatian Yesaya semakin luas. Keselamatan Allah
bukan hanya untuk satu kelompok manusia, melainkan menuju seluruh bangsa.
Allah menciptakan masa depan baru: umat yang dahulu hancur akan memperoleh
pengharapan, dan Yerusalem digambarkan sebagai pusat sukacita serta
pemulihan.
</p>
`,

                characters: [{
                    name: "Yesaya",
                    role: "Nabi Tuhan",
                    detail: "Dipanggil dalam penglihatan tentang takhta Allah dan menjadi penyampai pesan Tuhan kepada Yehuda.",
                    ref: "Yes 1:1; 6:1–8"
                }, {
                    name: "Uzia",
                    role: "Raja Yehuda",
                    detail: "Raja yang memerintah ketika pelayanan Yesaya dimulai. Tahun kematiannya menjadi latar panggilan Yesaya.",
                    ref: "Yes 6:1; 2 Taw 26"
                }, {
                    name: "Ahas",
                    role: "Raja Yehuda",
                    detail: "Menghadapi ancaman politik dan memilih mencari keamanan melalui kekuatan politik, bukan mempercayai Tuhan.",
                    ref: "Yes 7:1–17"
                }, {
                    name: "Hizkia",
                    role: "Raja Yehuda",
                    detail: "Raja yang menghadapi ancaman Sanherib. Dalam krisis tersebut ia mencari Tuhan.",
                    ref: "Yes 36–39"
                }, {
                    name: "Sanherib",
                    role: "Raja Asyur",
                    detail: "Memimpin serangan terhadap Yehuda dan mengepung Yerusalem.",
                    ref: "Yes 36–37"
                }, {
                    name: "Hamba Tuhan",
                    role: "Tokoh dalam nubuat",
                    detail: "Digambarkan sebagai Hamba yang menderita dan menanggung kesalahan banyak orang.",
                    ref: "Yes 42; 49; 50; 52:13–53:12"
                }],

                prophecy: [{
                    title: "Imanuel",
                    text: "Tanda tentang seorang anak yang disebut Imanuel menjadi bagian penting dalam pengharapan Yesaya.",
                    ref: "Yesaya 7:14 → Matius 1:22–23"
                }, {
                    title: "Raja Damai",
                    text: "Seorang anak akan memerintah dengan keadilan dan damai, berakar pada janji kepada keturunan Daud.",
                    ref: "Yesaya 9:5–6 → Lukas 1:32–33"
                }, {
                    title: "Hamba yang Menderita",
                    text: "Hamba Tuhan menderita dan menanggung kesalahan banyak orang.",
                    ref: "Yesaya 52:13–53:12 → Kisah 8:30–35; 1 Ptr 2:24"
                }, {
                    title: "Suara di Padang Gurun",
                    text: "Ada suara yang menyerukan persiapan jalan bagi Tuhan.",
                    ref: "Yesaya 40:3 → Matius 3:3"
                }],

                pb: [
                    "Yesaya 6 → Yohanes 12:41",
                    "Yesaya 7:14 → Matius 1:22–23",
                    "Yesaya 9:5–6 → Lukas 1:32–33",
                    "Yesaya 40:3 → Matius 3:3",
                    "Yesaya 53 → Kisah Para Rasul 8:32–35",
                    "Yesaya 53:5 → 1 Petrus 2:24"
                ],

                verses: [{
                    ref: "Yesaya 6:8",
                    text: "“Ini aku, utuslah aku!”"
                }, {
                    ref: "Yesaya 41:10",
                    text: "Jangan takut, sebab Tuhan menyertai dan menolong umat-Nya."
                }, {
                    ref: "Yesaya 53:5",
                    text: "Hamba Tuhan digambarkan menderita demi membawa pemulihan."
                }],

                terms: ["Serafim", "Imanuel", "Hamba Tuhan", "Mesias", "Sisa Israel", "Kekudusan"]
            },

            /* ================= YEREMIA ================= */

            {
                id: "yeremia",
                no: 24,
                name: "Yeremia",
                period: "± 627–586 SM dan sesudahnya",
                setting: "Yehuda, Yerusalem dan pembuangan",
                theme: "Pertobatan, penghukuman, kesetiaan Allah dan perjanjian baru",

                story: `

<p>
Yeremia dipanggil Allah ketika ia masih muda. Ia hidup pada masa
Yehuda sedang menuju kehancuran. Asyur telah melemah, Babel mulai bangkit,
dan para pemimpin Yehuda menghadapi tekanan politik yang sangat besar.
Namun masalah terdalam bangsa itu bukan hanya politik. Mereka telah
meninggalkan Tuhan dan mencampurkan penyembahan kepada Allah dengan
berbagai bentuk penyembahan berhala.
</p>

<p>
Yeremia menerima panggilan yang berat. Ia merasa masih terlalu muda,
tetapi Tuhan mengatakan bahwa sejak sebelum lahir ia telah ditetapkan
untuk menjadi nabi bagi bangsa-bangsa. Yeremia kemudian menjadi suara
yang tidak populer. Ia memperingatkan bahwa Yerusalem tidak akan aman
hanya karena di dalamnya terdapat Bait Allah. Umat harus sungguh-sungguh
bertobat.
</p>

<p>
Yeremia menyampaikan khotbah tentang Bait Allah. Ia menegur orang yang
merasa aman karena memiliki Bait Allah tetapi pada saat yang sama menindas
sesama, mencuri, berzinah, dan menyembah berhala. Bagi Yeremia,
kehadiran simbol keagamaan tidak dapat menggantikan ketaatan kepada Tuhan.
Karena pesannya keras, ia dibenci, dipukuli, dipenjarakan, dan beberapa
kali nyaris dibunuh.
</p>

<p>
Salah satu kisah paling terkenal terjadi ketika Yeremia dimasukkan ke
dalam perigi berlumpur. Ia tidak dibunuh karena Ebed-Melekh, seorang
Etiopia yang bekerja di istana, berani meminta izin raja untuk
menyelamatkannya. Peristiwa ini menunjukkan bahwa sekalipun Yeremia
menjadi nabi yang kesepian, Tuhan tetap memelihara hidupnya melalui
orang lain.
</p>

<p>
Pada masa pemerintahan Zedekia, Yerusalem akhirnya jatuh kepada Babel.
Namun bahkan ketika berbicara mengenai kehancuran, Yeremia menyampaikan
pengharapan. Ia membeli sebidang tanah sebagai tanda bahwa suatu hari
kehidupan akan kembali normal. Ia juga menyampaikan janji tentang
“perjanjian baru”, ketika hukum Tuhan tidak hanya tertulis pada loh batu,
tetapi ditaruh dalam hati umat.
</p>
`,

                characters: [{
                    name: "Yeremia",
                    role: "Nabi Tuhan",
                    detail: "Nabi yang diutus kepada Yehuda menjelang kehancuran Yerusalem.",
                    ref: "Yer 1:1–10"
                }, {
                    name: "Barukh",
                    role: "Juru tulis Yeremia",
                    detail: "Mencatat pesan-pesan Yeremia dan membacakannya kepada umat.",
                    ref: "Yer 36:4–8"
                }, {
                    name: "Zedekia",
                    role: "Raja Yehuda",
                    detail: "Raja terakhir Yehuda sebelum Yerusalem jatuh kepada Babel.",
                    ref: "Yer 37–39"
                }, {
                    name: "Ebed-Melekh",
                    role: "Pejabat Etiopia",
                    detail: "Menyelamatkan Yeremia dari perigi ketika nabi itu hampir mati.",
                    ref: "Yer 38:7–13"
                }, {
                    name: "Nebukadnezar",
                    role: "Raja Babel",
                    detail: "Memimpin Babel dalam penaklukan Yerusalem.",
                    ref: "Yer 39:1–3"
                }],

                prophecy: [{
                    title: "Perjanjian Baru",
                    text: "Allah menjanjikan perjanjian baru yang menyentuh hati manusia.",
                    ref: "Yeremia 31:31–34 → Ibrani 8:8–12"
                }, {
                    title: "Raja dari keturunan Daud",
                    text: "Allah menjanjikan tunas Daud yang menjalankan keadilan.",
                    ref: "Yeremia 23:5–6 → Lukas 1:32–33"
                }, {
                    title: "Babel",
                    text: "Babel akan menerima penghakiman Allah setelah dipakai sebagai alat penghukuman.",
                    ref: "Yeremia 50–51 → Wahyu 18"
                }],

                pb: [
                    "Yeremia 31:31–34 → Ibrani 8:8–12",
                    "Yeremia 31:34 → Ibrani 10:16–17",
                    "Yeremia 23:5–6 → Lukas 1:32–33",
                    "Yeremia 7 → Matius 21:13"
                ],

                verses: [{
                    ref: "Yeremia 1:5",
                    text: "Allah mengenal dan menetapkan Yeremia sebelum ia lahir."

            ${book.name}
        </button>
    `).join("");
        }


        function filterBooks() {

            const query =
                document.getElementById("search")
                .value
                .toLowerCase()
                .trim();

            document.querySelectorAll(".book-btn").forEach((button, index) => {

                const book = BOOKS[index];

                button.style.display =
                    book.name.toLowerCase().includes(query) ?
                    "block" :
                    "none";

            });
        }

/* =========================================================
   NEXT / PREVIOUS
========================================================= */

function nextBook(){
    showBook(currentIndex + 1);
}

function previousBook(){
    showBook(currentIndex - 1);
}


/* =========================================================
   MOBILE SIDEBAR
========================================================= */

function toggleSidebar(){

    document
        .getElementById("sidebar")
        .classList.toggle("open");

}


/* =========================================================
   READING PROGRESS
========================================================= */

window.addEventListener("scroll",()=>{

    const scrollTop =
        window.scrollY;

    const height =
        document.documentElement.scrollHeight
        - document.documentElement.clientHeight;

    const percentage =
        height > 0
        ? (scrollTop / height) * 100
        : 0;

    document.getElementById("progress")
        .style.width =
        Math.min(100,percentage) + "%";

});


/* =========================================================
   KEYBOARD NAVIGATION
========================================================= */

document.addEventListener("keydown",(event)=>{

    if(event.key === "ArrowRight"){
        nextBook();
    }

    if(event.key === "ArrowLeft"){
        previousBook();
    }

});


/* =========================================================
   START
========================================================= */

renderNav();
showBook(0);
