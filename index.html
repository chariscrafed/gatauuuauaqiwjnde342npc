<!DOCTYPE html>
<html lang="id">

<head>

    <style>
         :root {
            --bg: #10121D;
            --panel: #1D2233;
            --panel2: #2B3146;
            --panel3: #171A27;
            --text: #F5F4EE;
            --muted: #B2B8C8;
            --gold: #E7C25B;
            --green: #74C091;
            --blue: #79A8FF;
            --purple: #B89CFF;
            --red: #E98282;

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        
        body {
            background: var(--bg);
            color: var(--text);
            font-family: "Segoe UI", Arial, sans-serif;
            display: flex;
            height: 100vh;
            overflow: hidden;
        }
        /* =========================
   SIDEBAR
========================= */
        
        .sidebar {
            width: 310px;
            background: var(--panel);
            border-right: 1px solid var(--panel2);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
        }
        
        .sidebar-header {
            padding: 22px 15px;
            background: var(--panel2);
            border-bottom: 2px solid var(--gold);
            text-align: center;
        }
        
        .sidebar-header h1 {
            color: var(--gold);
            font-size: 21px;
            letter-spacing: .5px;
        }
        
        .sidebar-header p {
            color: var(--muted);
            margin-top: 5px;
            font-size: 14px;
        }
        
        .book-list {
            flex: 1;
            overflow-y: auto;
            padding: 8px 0;
        }
        
        .book-item {
            padding: 12px 18px;
            cursor: pointer;
            color: var(--muted);
            border-left: 4px solid transparent;
            transition: .2s;
            font-size: 15px;
        }
        
        .book-item:hover {
            background: var(--panel2);
            color: var(--text);
        }
        
        .book-item.active {
            background: var(--panel2);
            color: var(--gold);
            border-left-color: var(--gold);
            font-weight: bold;
        }
        /* =========================
   MAIN
========================= */
        
        .main-content {
            flex: 1;
            overflow-y: auto;
            padding: 42px;
        }
        
        .book-number {
            color: var(--green);
            font-size: 15px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        
        .book-title {
            color: var(--gold);
            font-size: 45px;
            font-weight: bold;
            margin-top: 5px;
        }
        
        .book-subtitle {
            color: var(--muted);
            font-size: 18px;
            margin: 8px 0 28px;
        }
        /* =========================
   META
========================= */
        
        .meta-grid {
            display: grid;
            grid-template-columns: 180px 1fr;
            gap: 11px 18px;
            background: var(--panel);
            border: 1px solid var(--panel2);
            border-radius: 10px;
            padding: 22px;
        }
        
        .meta-label {
            color: var(--green);
            font-weight: bold;
        }
        
        .meta-value {
            color: var(--muted);
            line-height: 1.6;
        }
        /* =========================
   SECTIONS
========================= */
        
        .section-title {
            margin: 40px 0 17px;
            padding-bottom: 10px;
            border-bottom: 2px solid var(--panel2);
            font-size: 28px;
            font-weight: bold;
        }
        
        .section-intro {
            color: var(--muted);
            line-height: 1.75;
            margin-bottom: 15px;
        }
        /* =========================
   CARDS
========================= */
        
        .card-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        
        .card {
            background: var(--panel);
            border: 1px solid var(--panel2);
            border-left: 4px solid var(--panel2);
            border-radius: 9px;
            padding: 21px;
            transition: .2s;
        }
        
        .card:hover {
            background: #22283d;
            border-left-color: var(--green);
        }
        
        .card h3 {
            color: var(--gold);
            font-size: 20px;
            margin-bottom: 9px;
        }
        
        .card p {
            color: var(--muted);
            line-height: 1.75;
            font-size: 16px;
        }
        
        .character {
            border-left-color: var(--purple);
        }
        
        .character h3 {
            color: var(--purple);
        }
        
        .story {
            border-left-color: var(--gold);
        }
        
        .prophecy {
            border-left-color: var(--red);
        }
        
        .prophecy h3 {
            color: var(--red);
        }
        
        .connection {
            border-left-color: var(--blue);
        }
        
        .connection h3 {
            color: var(--blue);
        }
        
        .encyclopedia {
            border-left-color: var(--green);
        }
        
        .encyclopedia h3 {
            color: var(--green);
        }
        
        .verse {
            border-left-color: var(--green);
        }
        
        .verse-ref {
            color: var(--green);
            font-size: 20px;
            font-weight: bold;
            margin-bottom: 8px;
        }
        /* =========================
   TAG
========================= */
        
        .tag {
            display: inline-block;
            background: var(--panel2);
            color: var(--muted);
            border-radius: 20px;
            padding: 5px 10px;
            margin: 4px 4px 4px 0;
            font-size: 12px;
        }
        /* =========================
   MOBILE
========================= */
        
        @media(max-width:768px) {
            body {
                flex-direction: column;
            }
            .sidebar {
                width: 100%;
                height: 220px;
                border-right: none;
                border-bottom: 1px solid var(--panel2);
            }
            .main-content {
                padding: 22px;
            }
            .book-title {
                font-size: 36px;
            }
            .meta-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
